name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ViscaCamLink.sln

      - name: Build
        run: dotnet build ViscaCamLink.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --project ViscaCamLink.Tests\ViscaCamLink.Tests.csproj --configuration Release --no-build --results-directory TestResults --report-trx

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $reportJson = dotnet list ViscaCamLink.sln package --vulnerable --include-transitive --format json --output-version 1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $report = ($reportJson -join "`n") | ConvertFrom-Json
          $findings = @(
            foreach ($project in $report.projects) {
              foreach ($framework in $project.frameworks) {
                foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                  if (@($package.vulnerabilities).Count -gt 0) {
                    "$($project.path): $($package.id) $($package.resolvedVersion) - $($package.vulnerabilities.severity -join ', ')"
                  }
                }
              }
            }
          )

          if ($findings.Count -gt 0) {
            $findings | ForEach-Object { Write-Error $_ }
            exit 1
          }

          Write-Host "No vulnerable packages found."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
