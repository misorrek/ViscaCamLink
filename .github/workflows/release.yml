name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release (for example, 1.0.0)
        required: true
        type: string
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DISPATCH_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.161
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = $env:DISPATCH_VERSION
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "A semantic version is required."
          }

          $releaseNotes = ".\Docs\RELEASE-NOTES-$version.md"
          if (Test-Path $releaseNotes) {
            .\Build-Velopack.ps1 -Version $version -ReleaseNotes $releaseNotes
          } else {
            .\Build-Velopack.ps1 -Version $version
          }

      - name: Upload GitHub release
        shell: pwsh
        env:
          VELOPACK_GITHUB_TOKEN: ${{ secrets.VELOPACK_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VELOPACK_GITHUB_TOKEN)) {
            throw "Configure the VELOPACK_GITHUB_TOKEN repository secret before running a release."
          }

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = $env:DISPATCH_VERSION
          }

          vpk upload github `
            --repoUrl "https://github.com/misorrek/ViscaCamLink" `
            --token $env:VELOPACK_GITHUB_TOKEN `
            --outputDir ".\releases\velopack" `
            --channel win `
            --tag "v$version" `
            --releaseName "ViscaCamLink $version" `
            --publish

      # Code signing is out of scope for this release.
      # - name: Sign release artifacts
